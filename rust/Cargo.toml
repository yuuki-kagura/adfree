[package]
name = "adfree-core"
version = "1.0.0"
edition = "2021"
description = "AdFree filtering core: packet/DNS engine + AdGuard filter engine, exposed to Kotlin through uniffi"
license = "Apache-2.0"

[lib]
name = "adfree_core"
crate-type = ["cdylib", "rlib"]

# The native-messaging host AdGuard's browser extension talks to. Chrome
# starts it directly, so it is a binary of its own; see
# `src/bin/adfree_native_host.rs`.
[[bin]]
name = "adfree-native-host"
path = "src/bin/adfree_native_host.rs"

[dependencies]
# The real AdGuard / Brave filtering engine: every AdGuard, EasyList, uBO and
# hosts-list rule is parsed and matched by the code these projects use.
# `single-thread` is disabled on purpose: it makes the engine !Send/!Sync.
# Patched fork, see `[patch.crates-io]` below.
adblock = { version = "0.13.3", default-features = false, features = [
  "full-regex-handling",
  "embedded-domain-resolver",
  # Splits `#?#` procedural selectors (`:has-text`, `:matches-css`, ...) into
  # operators the content script can execute, and validates CSS so a bad
  # selector can never take down a whole injected stylesheet.
  "css-validation",
] }
# Typed, checked Kotlin <-> Rust bridging (no hand written JNI).
uniffi = { version = "0.32.2", default-features = false }
# Direct syscall access for the TUN loop (poll/read/write). std's `File` would
# allocate and lock per call.
libc = "0.2"
# MITM stage: local CA, leaf certs on the fly, TLS termination.
rcgen = "0.13"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
# rcgen needs a wall-clock type for validity windows.
time = { version = "0.3", default-features = false, features = ["std"] }
# OpenSSL's `subject_hash_old` names Android's system CA files; the hash is
# MD5 over the DER subject, and no MD5 comes with ring.
md-5 = "0.10"
# Typed persisted state. The core owns the schema; the derive is what keeps
# the SQLite rows and the uniffi records the same shape.
serde = { version = "1", features = ["derive"] }
# Cosmetic payloads (per-page CSS/JS rules) travel as JSON into the HTML.
serde_json = { version = "1", features = ["preserve_order"] }
# `$replace` rule payloads (the crate refuses the modifier): the patterns are
# regular expressions applied to response bodies. The same engine the adblock
# crate already pulls in, used through its byte API.
regex = "1"
# Byte-level searching for the HTML filter (substrings inside response
# bodies); already in the tree through `regex`, named here to use it directly.
memchr = "2"
# Multi-pattern byte search: one pass finds every `class`/`id` attribute in a
# response, and it also serves case-insensitive content predicates without
# lowercasing (and copying) the element's content per rule.
aho-corasick = "1"
# `$redirect` resources come out of the engine as `data:` URLs; the HTTPS path
# decodes them into a response body.
base64 = "0.22"
# gzip/deflate for HTML that the origin compressed anyway: the body is decoded,
# rewritten and re-compressed so the page still travels compressed to the phone.
# Pure-Rust backend: no C toolchain in the Android cross build.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Blocking HTTP for filter lists and userscripts. The core stays free of
# async runtimes: the platform calls these from its own IO threads, and ureq
# reuses the rustls/ring stack the MITM stage already builds on.
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
# Opt-in HTTP/3 filtering: QUIC is terminated against the local CA and
# re-originated upstream. quinn drives the transports, h3 the request layer.
# `rustls-ring` keeps the same crypto backend as the HTTPS stage.
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
# Only the QUIC workers run an async runtime; the rest of the core stays
# blocking. Current-thread is enough: one `adfree-quic` thread owns it.
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "io-util"] }
# h3 passes request/response heads around with these types.
http = "1"
bytes = "1"
x509-parser = "0.18.1"

# Upstream 0.13.5 plus two changes: a debug-info engine stores each matched
# rule's source line, not the rule text itself, and rejected lines keep only
# their count. The text is read back from the list file when a block is
# logged, which keeps ~20 MB of stored rule text (one string per rule) out of
# every loaded engine.
# Published fork: https://github.com/yuuki-kagura/adblock-rust (branch
# `master`). Cargo.lock pins the exact revision, so builds stay reproducible
# until the fork is updated deliberately. The fork is public because CI has to
# fetch it without a credential: the account it used to live under is gone, and
# a private URL here is a build that only works on the machine that has it.
[patch.crates-io]
adblock = { git = "https://github.com/yuuki-kagura/adblock-rust", branch = "master" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
#  would drop the uniffi metadata block that the bindings
# generator needs, so only debug info is stripped.
strip = "debuginfo"
incremental = false
