name: Linux Release

# The desktop app is a second product on the same tag: the Android release job
# creates the release, and these jobs attach the packages a Linux user installs.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach packages to (e.g. v1.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: linux-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  deb-rpm:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # jpackage shells out to the distribution's own tooling: `dpkg-deb` for
      # the deb, `rpmbuild` for the rpm. A runner without them builds neither.
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot rpm

      - name: Build the filtering core
        run: cargo build --release --lib
        working-directory: rust

      - name: Build deb and rpm
        run: ./gradlew --no-daemon :desktop:packageDeb :desktop:packageRpm

      - name: Attach packages to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" \
            desktop/build/compose/binaries/main/deb/*.deb \
            desktop/build/compose/binaries/main/rpm/*.rpm \
            --clobber

  arch:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Arch and CachyOS install neither a deb nor an rpm, so the package has to
      # be built where those come from — and it has to be built from the tree
      # being released, not from a second download of it: a tarball of this
      # checkout is what the PKGBUILD is pointed at below.
      - name: Make the source tarball
        run: |
          VERSION="${TAG#v}"
          git archive --prefix="adfree-$VERSION/" -o "$RUNNER_TEMP/adfree-$VERSION.tar.gz" HEAD
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build the Arch package
        run: |
          mkdir -p out
          docker run --rm \
            -e VERSION="$VERSION" \
            -v "$GITHUB_WORKSPACE/packaging:/packaging:ro" \
            -v "$RUNNER_TEMP:/tarball:ro" \
            -v "$GITHUB_WORKSPACE/out:/out" \
            archlinux:base-devel \
            bash -euo pipefail -s <<'SCRIPT'
          pacman -Sy --noconfirm --needed base-devel git jdk21-openjdk rust cargo unzip >/dev/null
          useradd -m builder
          mkdir -p /home/builder/pkg
          cp /packaging/arch/PKGBUILD "/tarball/adfree-$VERSION.tar.gz" /home/builder/pkg/
          chown -R builder: /home/builder
          cd /home/builder/pkg
          # Point the formula at the tarball that is here rather than at a
          # second download of the same tree.
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD
          sed -i "s|^source=.*|source=(\"adfree-\$pkgver.tar.gz\")|" PKGBUILD
          su builder -c 'cd /home/builder/pkg && makepkg -f --noconfirm'
          cp /home/builder/pkg/*.pkg.tar.zst /out/
          SCRIPT

      - name: Attach the package to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" out/*.pkg.tar.zst --clobber
