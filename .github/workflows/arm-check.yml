# Does the desktop package build for ARM?
#
# Not a release job: this one builds and uploads nothing, it just answers the
# question a release would fail on. jpackage bundles the JRE it runs on, so an
# arm64 deb can only be made on an arm64 machine — which means the arm build is
# exactly the thing that is never exercised by building on x64.
name: Desktop ARM check

on:
  workflow_dispatch:
  push:
    paths:
      - "rust/src/**"
      - "rust/Cargo.toml"
      - "desktop/**"
      - "shared/**"
      - "packaging/**"
      - ".github/workflows/arm-check.yml"

jobs:
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot rpm

      - name: Build the device's own core
        working-directory: rust
        run: |
          uname -m
          cargo build --release --lib --locked
          # The same two questions the x64 release asks: does the library carry
          # sqlite, and does it reference anything this machine does not have.
          nm target/release/libadfree_core.so | grep -q ' t sqlite3_open$' ||
            { echo "::error::no bundled sqlite in the arm64 core"; exit 1; }
          ! ldd -r target/release/libadfree_core.so 2>&1 | grep -q 'undefined symbol' ||
            { echo "::error::the arm64 core links against nothing-provided symbols"; exit 1; }

      - name: Build the deb and the rpm
        run: ./gradlew --no-daemon :desktop:packageDeb :desktop:packageRpm

      - name: What came out
        run: |
          uname -m
          find desktop/build/compose/binaries/main -name '*.deb' -o -name '*.rpm' | xargs -r ls -l
